name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install client dependencies
        run: |
          cd client
          npm install

      # O Pages serve apenas o frontend estático; a API (proxy NTRIP/IBGE, SSE,
      # CSV) roda no Render. VITE_API_URL define a origem absoluta da API.
      # Configure a variável de repositório PAGES_API_URL para sobrescrever.
      - name: Build client (Pages)
        run: |
          cd client
          npm run build -- --base=/rbmc-ntrip-real-time-monitor/
        env:
          VITE_API_URL: ${{ vars.PAGES_API_URL || 'https://rbmc-monitor.onrender.com' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - id: deployment
        uses: actions/deploy-pages@v4
