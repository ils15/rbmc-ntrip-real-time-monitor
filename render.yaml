services:
  - type: web
    name: rbmc-monitor
    env: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: NTRIP_CASTER_URL
        value: http://170.84.40.52:2101
      - key: RBMC_API_BASE_URL
        value: https://servicodados.ibge.gov.br/api/v1/rbmc
      - key: IBGE_API_BASE_URL
        value: https://servicodados.ibge.gov.br/api/v1/rbmc/estacoes
      - key: IBGE_CACHE_TTL
        value: "300000"
      - key: CACHE_TTL_MS
        value: "300000"
